# Shared defaults for all configs
seed: 33

# data
in_memory: true
lru_size: 16
batch_size: 32
num_workers: 4
persistent_workers: true
pin_memory: true

# sampler / rare subclass oversampling
sampler_balance: subclass
sampler_weight_power: 1.0
sampler_num_samples_multiplier: 1.0

# optimizer
lr: 3.0e-4
weight_decay: 1.0e-4
lr_factor: 0.5
lr_patience: 3
min_lr: 1.0e-6

# training
max_epochs: 50
grad_clip: 1.0
early_stop_patience: 10

# loss
focal_gamma: 2.0
focal_alpha: 0.25

# model (overridden per config)
model: densenet161_pretrained
drop_first_downsampling: true
dropout: 0.0
pretrained: true

# transfer learning
freeze_epochs: 0
backbone_lr: null

# eval
target_npv: 0.95

# tracking
wandb_enabled: false
wandb_project: kvasir-triage
