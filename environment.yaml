name: kvasir-triage
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pytorch::pytorch>=2.1
  - pytorch::torchvision>=0.16
  - pytorch::pytorch-cuda=12.1
  - numpy>=1.24
  - pandas>=2.0
  - pillow>=10.0
  - scikit-learn>=1.3
  - pyyaml>=6.0
  - psutil>=5.9
  - tqdm>=4.65
  - matplotlib>=3.7
  - seaborn>=0.12
  - pip:
    - albumentations>=1.3
    - grad-cam>=1.4
    - wandb>=0.15
    - -e .
